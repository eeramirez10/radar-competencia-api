name: radar-competencia

services:
  postgres:
    image: postgres:17-bookworm
    container_name: radar-competencia-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-radar_competencia}
      POSTGRES_USER: ${POSTGRES_USER:-radar_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --data-checksums
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: 256mb
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  volume-init:
    build:
      context: .
      target: runtime
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
    command:
      - >-
        mkdir -p
        /app/storage/uploads/competitors
        /app/storage/uploads/customer-directory
        /app/storage/legacy
        && chown -R node:node /app/storage
    volumes:
      - radar_files:/app/storage
    restart: "no"

  radar-competencia-api:
    build:
      context: .
      target: runtime
    image: radar-competencia-api:local
    container_name: radar-competencia-api
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3010
      STORAGE_DIR: /app/storage
      DATABASE_STORAGE_LABEL: postgresql-docker
      DATABASE_URL: postgresql://${POSTGRES_USER:-radar_app}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-radar_competencia}
      DIRECT_URL: postgresql://${POSTGRES_USER:-radar_app}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-radar_competencia}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD in .env}
      AUTH_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-12}
    ports:
      - "127.0.0.1:${HOST_PORT:-3010}:3010"
    volumes:
      - radar_files:/app/storage
      - ./data:/app/legacy-data:ro
    depends_on:
      postgres:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3010/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  migrate:
    profiles: [migrate]
    build:
      context: .
      target: runtime
    image: radar-competencia-api:local
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-radar_app}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-radar_competencia}
      DIRECT_URL: postgresql://${POSTGRES_USER:-radar_app}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-radar_competencia}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - npm
      - run
      - db:deploy
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: "no"

  import-local-data:
    profiles: [import]
    build:
      context: .
      target: runtime
    image: radar-competencia-api:local
    environment:
      NODE_ENV: production
      DATA_IMPORT_DIR: /app/import-data
      DATABASE_URL: postgresql://${POSTGRES_USER:-radar_app}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-radar_competencia}
      DIRECT_URL: postgresql://${POSTGRES_USER:-radar_app}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-radar_competencia}
    entrypoint:
      - node
      - dist/import-local-data.js
    command:
      - --resume
    volumes:
      - ./data:/app/import-data:ro
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: "no"

  backup:
    profiles: [backup]
    image: postgres:17-bookworm
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-radar_competencia}
      PGUSER: ${POSTGRES_USER:-radar_app}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    entrypoint:
      - /bin/sh
      - -c
    command:
      - >-
        pg_dump --format=custom --no-owner --no-privileges
        --file="/backups/radar_competencia_$$(date +%Y%m%d_%H%M%S).dump"
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: "no"

volumes:
  postgres_data:
    name: radar_competencia_postgres
  radar_files:
    name: radar_competencia_files
